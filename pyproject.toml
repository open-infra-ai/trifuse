[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trifuse"
version = "2.0.1"
description = "Small, verifiable Triton kernels for Transformer inference"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "holtwood"}
]
maintainers = [
    {name = "holtwood"}
]
keywords = [
    "triton",
    "cuda",
    "gpu",
    "transformer",
    "operator-fusion",
    "deep-learning",
    "machine-learning",
    "rmsnorm",
    "rope",
    "gated-mlp",
    "flash-attention",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.4.0",  # ops.py 使用 torch.library.custom_op（2.4 引入）
    "triton>=2.1.0",
    "numpy>=1.21.0",
]

[project.urls]
Homepage = "https://github.com/open-infra-ai/trifuse"
Repository = "https://github.com/open-infra-ai/trifuse.git"
Issues = "https://github.com/open-infra-ai/trifuse/issues"
Changelog = "https://github.com/open-infra-ai/trifuse/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "hypothesis>=6.0.0",
    "build>=1.2.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["trifuse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["trifuse"]
branch = true
omit = [
    "trifuse/__init__.py",
    "tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # Line too long (handled by formatter policy)
    "UP035", # Keep the existing public typing style
    "UP006", # Keep the existing public typing style
]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["F841"]  # Allow unused variables in examples
"trifuse/kernels/*" = ["F841"]  # Allow unused variables in kernels (may be used for debugging)
"trifuse/autotuner/*" = ["F841"]  # Allow unused variables in autotuner

[tool.mypy]
python_version = "3.12"  # numpy 2.x stub 使用 3.12 的 type 语法
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "skip"
no_implicit_optional = false
check_untyped_defs = true

[[tool.mypy.overrides]]
# numpy pure-compute reference implementations return untyped ndarray operations
module = "trifuse.reference.*"
warn_return_any = false
warn_unused_ignores = false
